name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache node_modules
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Build JS files
        env:
          VITE_PUSH_API_URL: ${{ vars.PUSH_API_URL }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: |
          npm i
          npm run build -- --base="/return-visits/"

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
